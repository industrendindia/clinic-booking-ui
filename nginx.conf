limit_req_zone $binary_remote_addr zone=queue_registration:10m rate=5r/m;
server { listen 80; root /usr/share/nginx/html; index index.html; location ~ ^/api/public/queue/[^/]+$ { limit_req zone=queue_registration burst=3 nodelay; proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } location /api/ { proxy_pass http://api:8080/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; } location / { try_files $uri /index.html; } }
